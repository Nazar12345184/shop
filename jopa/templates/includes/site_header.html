<header class="esports-topbar">
    <a class="brand" href="{% url 'home' %}">
        <span class="brand-mark">G</span>
        <span>{{ site_config.site_name }}<small>{{ site_config.tagline }}</small></span>
    </a>
    <nav class="topbar-nav" aria-label="Основна навігація">
        <a href="{% url 'home' %}"{% if request.resolver_match.url_name == 'home' or request.resolver_match.url_name == 'main' %} class="nav-current"{% endif %}>Каталог</a>
        <a href="{% url 'author_list' %}"{% if request.resolver_match.url_name == 'author_list' or request.resolver_match.url_name == 'author_detail' %} class="nav-current"{% endif %}>Автори</a>
        {% if request.user.is_authenticated %}
        <a href="{% url 'library' %}"{% if request.resolver_match.url_name == 'library' or request.resolver_match.url_name == 'purchased_game' %} class="nav-current"{% endif %}>Бібліотека</a>
        <a href="{% url 'profile' %}"{% if request.resolver_match.url_name == 'profile' %} class="nav-current"{% endif %}>Профіль</a>
        {% if request.user.is_staff %}
        <a href="{% url 'manage_site' %}"{% if request.resolver_match.url_name == 'manage_site' %} class="nav-current"{% endif %}>Керування</a>
        {% endif %}
        <a href="{% url 'submit_game' %}"{% if request.resolver_match.url_name == 'submit_game' %} class="nav-current"{% endif %}>Запропонувати</a>
        <form method="post" action="{% url 'logout' %}" class="nav-logout">
            {% csrf_token %}
            <button type="submit">Вийти</button>
        </form>
        {% else %}
        <a href="{% url 'submit_game' %}"{% if request.resolver_match.url_name == 'submit_game' %} class="nav-current"{% endif %}>Запропонувати</a>
        <a href="{% url 'login' %}"{% if request.resolver_match.url_name == 'login' %} class="nav-current"{% endif %}>Увійти</a>
        <a href="{% url 'register' %}"{% if request.resolver_match.url_name == 'register' %} class="nav-current"{% endif %}>Реєстрація</a>
        {% endif %}
    </nav>
</header>
